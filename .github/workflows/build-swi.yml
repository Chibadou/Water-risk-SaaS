# Builds the SWI soil-moisture climatology on a runner with full network access
# (the dev sandbox cannot reach data.gouv). Only the climatology is committed —
# the current month is fetched live at request time, so nothing here goes stale.
name: Build SWI climatology

on:
  push:
    branches:
      - "claude/water-restriction-risk-tool-td2yss"
    paths:
      - "data/swi-request.json"
      - ".github/workflows/build-swi.yml"
      - "scripts/swi/build_swi.py"

permissions:
  contents: write

concurrency:
  group: build-swi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests pyproj
      - name: Build SWI climatology
        run: python scripts/swi/build_swi.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/swi
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore(swi): climatology from Actions run ${{ github.run_id }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
